<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lion Zone</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', 'Tahoma', sans-serif;
    background: #f0ede4;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  /* กรอบมือถือ */
  .phone {
    width: 320px;
    height: 640px;
    background: #fdf6e9;
    border-radius: 36px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    border: 6px solid #2b2b2b;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    padding: 12px 20px 0;
    font-size: 13px;
    font-weight: 600;
    color: #333;
  }

  /* Header: ปุ่มย้อนกลับ + ชื่อหน้า */
  .header {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    position: relative;
  }

  .back-btn {
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: #333;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: background 0.2s;
  }

  .back-btn:hover {
    background: rgba(0,0,0,0.06);
  }

  .header h1 {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 18px;
    font-weight: 700;
    color: #333;
  }

  /* ภาพสิงโต */
  .lion-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 20px 0;
  }

  .lion-scene {
    width: 100%;
    aspect-ratio: 1.1 / 1;
  }

  /* ข้อความคำอธิบาย */
  .description {
    text-align: center;
    padding: 16px 30px;
    font-size: 15px;
    line-height: 1.6;
    color: #4a4a4a;
    font-weight: 500;
  }

  /* ปุ่มเริ่มเกม */
  .footer {
    padding: 16px 24px 28px;
  }

  .start-btn {
    width: 100%;
    padding: 15px;
    background: #4a8c3f;
    color: #fff;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
    box-shadow: 0 4px 10px rgba(74,140,63,0.35);
  }

  .start-btn:hover {
    background: #427a38;
  }

  .start-btn:active {
    transform: scale(0.97);
  }
</style>
</head>
<body>

<div class="phone">

  <div class="header">
    <button class="back-btn" id="backBtn" aria-label="ย้อนกลับ">←</button>
    <h1>Lion Zone</h1>
  </div>

  <div class="lion-container">
    <p><img src="../assets/img/lionlogo.png" alt="Lion" width="200px" height="200px"></p>
  </div>

  <style>
  .description {
    text-align: center;
    padding: 16px 30px;
    color: #4a4a4a;
  }

  .description h2 {
    text-align: center;   /* บังคับกึ่งกลางแม้ h2 จะมี default style */
    margin: 2px 0;         /* ระยะห่างระหว่างบรรทัดน้อยลง */
    font-size: 15px;
    font-weight: 600;
    line-height: 1.6;
  }
</style>

<p class="description">
  <h2>สิงโตทำตราหล่นไว้</h2>
  <h2>ช่วยจับคู่รอยเท้า</h2>
  <h2>ให้ถูกต้อง!</h2>
</p>

  <div class="footer">
    <button class="start-btn" id="startBtn">เริ่มเกม</button>
  </div>

</div>

<script>
  // ปุ่มย้อนกลับ: กลับไปหน้าก่อนหน้าของเบราว์เซอร์
  document.getElementById('backBtn').addEventListener('click', () => {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      alert('ย้อนกลับไปหน้าก่อนหน้า');
    }
  });

  // ปุ่มเริ่มเกม -> ไปหน้ามินิเกมจับคู่รอยเท้าสิงโต
  document.getElementById('startBtn').addEventListener('click', () => {
    window.location.href = '../05-mini-game/index.html';
  });
</script>

</body>
</html>
