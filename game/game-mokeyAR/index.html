<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Monkey Banana Catch - Speed Challenge</title>
  
  <!-- CSS Style -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- MediaPipe Libraries for Eye Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

  <h1>ช่วยลิงน้อยจอมซนเก็บกล้วย</h1>
  
  <div id="game-container">
    <div id="ui">
      <div class="badge">⏱️ เวลา: <span id="timer" style="color: #38bdf8;">60</span> วินาที</div><br>
      <div class="badge">🍌 คะแนน: <span id="score" style="color: #facc15;">0</span> / 100</div><br>
      <div class="badge" id="blink-status" style="color: #4ade80;">ตา: ปกติ</div>
    </div>

    <button id="btn-fullscreen" class="btn-icon" title="เต็มจอ" aria-label="สลับโหมดเต็มจอ">⛶</button>
    <button id="btn-skill" class="btn-skill" style="display:none;" aria-label="ใช้สกิลล้างกล้วยพิษ">⚡ ใช้สกิล</button>

    <video id="webcam-preview" autoplay playsinline muted></video>
    <canvas id="gameCanvas"></canvas>

<!-- หน้าจอเมนูเลือกโหมดก่อนเริ่มเกม (ธีมป่าพร้อมลวดลายใบไม้) -->
    <div id="mode-select-screen" style="position:absolute; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle at center, rgba(34,84,41,0.95) 0%, rgba(15,38,20,0.98) 100%), repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 10px); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:50; text-align:center; padding:20px; border: 8px solid #5c2c16; border-radius: 16px;">
      
      <!-- กรอบรูปลิงด้านบน สไตล์ธรรมชาติ -->
      <div style="width: 84px; height: 84px; background: radial-gradient(circle, #facc15, #b45309); border-radius: 50%; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.6); overflow: hidden;">
        <img src="pic/Monkeylogo.png" alt="Monkey Logo" style="width: 80%; height: 80%; object-fit: contain;">
      </div>

      <h2 style="color:#fef08a; font-size:clamp(1.5rem, 4vw, 1.8rem); margin-bottom:8px; text-shadow: 2px 2px 0px #000;">Monkey Banana Catch</h2>
      <p style="color:#cbd5e1; font-size:clamp(0.9rem, 2.5vw, 1rem); margin-bottom:24px; text-shadow: 1px 1px 0px #000;">เลือกวิธีการควบคุมลิงเก็บกล้วยที่คุณต้องการ</p>
      
      <div style="display:flex; flex-direction:column; gap:12px; width:100%; max-width:280px;">
        <button id="select-camera" style="padding:14px 20px; background:linear-gradient(135deg, #16a34a, #15803d); color:#fff; border:2px solid #86efac; border-radius:14px; font-weight:bold; font-size:1rem; cursor:pointer; box-shadow:0 4px 12px rgba(22,163,74,0.5); text-shadow: 1px 1px 0px rgba(0,0,0,0.3);">
          โหมดกล้อง (ขยับหน้า AR)
        </button>
        <button id="select-touch" style="padding:14px 20px; background:linear-gradient(135deg, #ca8a04, #a16207); color:#fff; border:2px solid #fef08a; border-radius:14px; font-weight:bold; font-size:1rem; cursor:pointer; box-shadow:0 4px 12px rgba(202,138,4,0.5); text-shadow: 1px 1px 0px rgba(0,0,0,0.3);">
          โหมดลาก (เมาส์ / นิ้วมือ)
        </button>
      </div>
    </div>

    <!-- หน้าจอแสดงผลเมื่อจบเกม (Modal Overlay) -->
    <div id="overlay">
      <div id="overlay-scroll">
        <div id="result-card" class="result-card">

          <div class="result-avatar-wrap">
            <span class="result-sparkle sparkle-tl">✨</span>
            <span class="result-sparkle sparkle-tr">✨</span>
            <div class="result-avatar"><img src="pic/Monkeylogo.png" alt=""></div>
          </div>

          <h2 id="end-title" class="result-title"></h2>

          <div class="result-reward-box">
            <div id="result-reward-label" class="result-reward-label">🏅 ยินดีด้วย! คุณได้รับ</div>
            <div id="result-reward-name" class="result-reward-name">Animal Stamp: Monkey Zone</div>
          </div>

          <p id="end-desc" class="result-desc"></p>

          <div class="result-point-pill">
            <span class="result-point-icon">💎</span>
            <span class="result-point-text">
              <span class="result-point-label">POINT</span>
              <span id="result-point-value" class="result-point-value">0</span>
            </span>
          </div>

          <div class="result-actions">
            <button class="btn-result btn-result-primary" id="btn-restart">🔄 เล่นอีกครั้ง</button>
            <button class="btn-result btn-result-secondary" id="btn-view-collection">รับตราประทับ 🎁</button>
          </div>

          <!-- แสตมป์ใหม่ที่ได้รับในรอบนี้ -->
          <div id="stamps-earned-section" class="stamps-earned-section"></div>

          <!-- คอลเลกชันแสตมป์สัตว์ทั้งหมด (ซ่อนไว้ก่อน กดปุ่ม "ดูคอลเลกชัน" เพื่อแสดง) -->
          <div class="stamps-collection-wrap" id="stamps-collection-wrap" hidden>
            <h3 class="stamps-collection-title">🏅 คอลเลกชันแสตมป์ลิงของคุณ</h3>
            <p class="stamps-collection-progress" id="stamps-progress"></p>
            <div id="stamps-collection-grid" class="stamps-grid"></div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <p id="status">กรุณาเลือกโหมดการเล่นเพื่อเริ่มเกม...</p>

  <!-- JavaScript: จัดการโหมดเต็มจอ / responsive -->
  <script src="js/responsive.js"></script>
  <!-- JavaScript Game Logic -->
  <script src="js/game.js"></script>
</body>
</html>
