<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoo Explorer — สแกน QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #f6f1e6;
    --forest-dark: #1f3d1a;
    --leaf: #5a9c3f;
    --leaf-light: #7fc957;
    --gold: #f0a336;
    --ink: #2c2418;
    --muted: #9a9384;
    --danger: #c1533f;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }

  html, body{
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Nunito', sans-serif;
    color: var(--cream);
  }

  .app{
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: #000;
  }

  /* ---------- HEADER ---------- */
  .header {
    position: relative;
    z-index: 3;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: clamp(14px, 2.4vh, 20px) clamp(16px, 4vw, 28px);
    background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 100%);
  }
  .back-btn {
    background: rgba(255,255,255,0.16);
    border: none;
    color: var(--cream);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease;
    flex-shrink: 0;
  }
  .back-btn:hover { background: rgba(255,255,255,0.3); }
  .header h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(17px, 2.2vw, 21px);
    color: var(--gold);
  }

  /* ---------- CAMERA ---------- */
  .camera-wrap{
    position: absolute;
    inset: 0;
    z-index: 1;
    background: #111;
  }
  video{
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ---------- SCAN FRAME OVERLAY ---------- */
  .scan-overlay{
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    pointer-events: none;
  }
  .scan-box{
    width: min(64vw, 280px);
    height: min(64vw, 280px);
    position: relative;
  }
  .scan-box .corner{
    position: absolute;
    width: 34px;
    height: 34px;
    border: 4px solid var(--leaf-light);
  }
  .scan-box .corner.tl{ top:0; left:0; border-right:none; border-bottom:none; border-radius: 10px 0 0 0; }
  .scan-box .corner.tr{ top:0; right:0; border-left:none; border-bottom:none; border-radius: 0 10px 0 0; }
  .scan-box .corner.bl{ bottom:0; left:0; border-right:none; border-top:none; border-radius: 0 0 0 10px; }
  .scan-box .corner.br{ bottom:0; right:0; border-left:none; border-top:none; border-radius: 0 0 10px 0; }
  .scan-line{
    position: absolute;
    left: 6%;
    right: 6%;
    height: 3px;
    background: var(--leaf-light);
    box-shadow: 0 0 8px var(--leaf-light);
    top: 0;
    animation: scan-move 2.2s ease-in-out infinite;
    border-radius: 2px;
  }
  @keyframes scan-move{
    0%   { top: 4%; }
    50%  { top: 92%; }
    100% { top: 4%; }
  }
  .scan-hint{
    margin-top: 22px;
    font-size: clamp(13px, 1.8vw, 15px);
    font-weight: 700;
    color: var(--cream);
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    text-align: center;
    padding: 0 30px;
  }
  .zone-chip{
    margin-top: 10px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,0,0,0.4);
    font-weight: 700;
    font-size: 13px;
    padding: 6px 16px;
    border-radius: 999px;
  }

  /* ---------- STATE OVERLAYS ---------- */
  .state-overlay{
    position: absolute;
    inset: 0;
    z-index: 4;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 0 32px;
    background: rgba(10,14,8,0.92);
  }
  .state-overlay.show{ display: flex; }
  .state-overlay .emoji{ font-size: 46px; margin-bottom: 14px; }
  .state-overlay h2{ font-family:'Baloo 2', sans-serif; font-size: 19px; margin-bottom: 8px; color: var(--gold); }
  .state-overlay p{ font-size: 14px; color: var(--cream); opacity: 0.85; line-height: 1.6; margin-bottom: 22px; }
  .state-btn{
    padding: 13px 26px;
    background: var(--leaf);
    color: #fff;
    border: none;
    border-radius: 30px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(74,140,63,0.35);
  }
  .state-btn:hover{ background: #427a38; }

  /* ---------- DEV TEST SKIP & MENU ---------- */
  .dev-skip{
    position: absolute;
    left: 0; right: 0;
    bottom: clamp(18px, 3vh, 28px);
    z-index: 3;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    text-decoration: underline;
    cursor: pointer;
  }
  
  .dev-modal {
    position: absolute;
    inset: 0;
    z-index: 10;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .dev-modal.show { display: flex; }
  .dev-card {
    background: #1a2417;
    border: 2px solid var(--gold);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 320px;
    text-align: center;
  }
  .dev-card h3 {
    font-family: 'Baloo 2', sans-serif;
    color: var(--gold);
    margin-bottom: 12px;
    font-size: 18px;
  }
  .dev-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 60vh;
    overflow-y: auto;
    margin-bottom: 16px;
  }
  .dev-item {
    background: rgba(255,255,255,0.08);
    border: none;
    color: var(--cream);
    padding: 10px 14px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s;
  }
  .dev-item:hover {
    background: var(--leaf);
  }
  .dev-close {
    background: transparent;
    border: 1px solid var(--muted);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
  }
  .dev-close:hover { color: var(--cream); border-color: var(--cream); }
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <button class="back-btn" id="backBtn" aria-label="ย้อนกลับ">←</button>
    <h1>สแกน QR ประจำโซน</h1>
  </div>

  <div class="camera-wrap">
    <video id="video" playsinline autoplay muted></video>
  </div>

  <div class="scan-overlay">
    <div class="scan-box">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="scan-line"></div>
    </div>
    <div class="scan-hint">
      ส่องกล้องไปที่ป้าย QR หน้าโซน<br>เพื่อยืนยันว่ามาถึงจุดนี้จริง
    </div>
    <div class="zone-chip" id="zoneChip">📍 —</div>
  </div>

  <div class="state-overlay" id="successOverlay">
    <div class="emoji">✅</div>
    <h2>สแกนสำเร็จ!</h2>
    <p id="successText">ยืนยันตัวตนที่โซนนี้เรียบร้อยแล้ว</p>
  </div>

  <div class="state-overlay" id="errorOverlay">
    <div class="emoji">📷</div>
    <h2 id="errorTitle">เปิดกล้องไม่ได้</h2>
    <p id="errorText">กรุณาอนุญาตให้เว็บนี้ใช้กล้อง แล้วลองใหม่อีกครั้ง</p>
    <button class="state-btn" id="retryBtn">ลองใหม่</button>
  </div>

  <div class="dev-skip" id="devSkip">🔧 โหมดทดสอบ: เลือกเกมที่จะลิ้งไป</div>

  <!-- Modal สำหรับเลือกเกมทดสอบ -->
  <div class="dev-modal" id="devModal">
    <div class="dev-card">
      <h3>เลือกเกมเพื่อทดสอบ</h3>
      <div class="dev-list" id="devList">
        <!-- รายการเกมจะถูกสร้างด้วย JavaScript อัตโนมัติจากโครงสร้างโฟลเดอร์ game -->
      </div>
      <button class="dev-close" id="devClose">ปิด</button>
    </div>
  </div>

</div>

<script src="../../../assets/js/jsqr.min.js?v=3"></script>
<script src="../../../assets/js/zoo-state.js?v=3"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const zoneId = params.get('zone');

  const ZONE_INFO = {
    lion:     { name: 'Lion Zone',     emoji: '🦁' },
    elephant: { name: 'Elephant Zone', emoji: '🐘' },
    giraffe:  { name: 'Giraffe Zone',  emoji: '🦒' },
    penguin:  { name: 'Penguin Zone',  emoji: '🐧' },
    panda:    { name: 'Panda Zone',    emoji: '🐼' },
    monkey:   { name: 'Monkey Zone',   emoji: '🐵' },
  };

  const info = ZONE_INFO[zoneId] || { name: 'General Zone', emoji: '📍' };
  document.getElementById('zoneChip').textContent = `${info.emoji} ${info.name}`;

  // กำหนด path ลิงก์ตรงไปยังโฟลเดอร์ game แต่ละอันตามโครงสร้างโปรเจกต์ของคุณ
  const ZONE_GAME_URL = {
    lion:     '../../../game/game-lion/index.html',
    elephant: '../../../game/game-elephantAR/index.html',
    giraffe:  '../../../game/game-giraffe/index.html',
    penguin:  '../../../game/game-penguinAr/index.html',
    panda:    '../../../game/game-panda/index.html',
    monkey:   '../../../game/game-monkeyAR/index.html',
  };

  const video = document.getElementById('video');
  const successOverlay = document.getElementById('successOverlay');
  const successText = document.getElementById('successText');
  const errorOverlay = document.getElementById('errorOverlay');
  const errorTitle = document.getElementById('errorTitle');
  const errorText = document.getElementById('errorText');
  const retryBtn = document.getElementById('retryBtn');
  
  const devSkip = document.getElementById('devSkip');
  const devModal = document.getElementById('devModal');
  const devList = document.getElementById('devList');
  const devClose = document.getElementById('devClose');

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  let stream = null;
  let rafId = null;
  let scanned = false;

  function goToZoneContent(targetUrl){
    stopCamera();
    window.location.href = targetUrl;
  }

  function onScanSuccess(decodedText, customTargetUrl = null){
    if (scanned) return;
    scanned = true;
    stopCamera();

    const targetUrl = customTargetUrl || ZONE_GAME_URL[zoneId] || '../03-home/index.html';

    successText.textContent = `ยืนยันตัวตนสำเร็จ กำลังพามุ่งหน้าสู่เกม...`;
    successOverlay.classList.add('show');
    setTimeout(() => {
      window.location.href = targetUrl;
    }, 1200);
  }

  function tick(){
    if (scanned) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = window.jsQR ? jsQR(imageData.data, imageData.width, imageData.height) : null;
      if (code && code.data) {
        onScanSuccess(code.data);
        return;
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  async function startCamera(){
    errorOverlay.classList.remove('show');
    successOverlay.classList.remove('show');
    scanned = false;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();
      rafId = requestAnimationFrame(tick);
    } catch (err) {
      errorTitle.textContent = 'เปิดกล้องไม่ได้';
      if (err && err.name === 'NotAllowedError') {
        errorText.textContent = 'คุณยังไม่ได้อนุญาตให้เว็บนี้ใช้กล้อง ลองอนุญาตแล้วกดลองใหม่';
      } else if (err && err.name === 'NotFoundError') {
        errorText.textContent = 'ไม่พบกล้องบนอุปกรณ์นี้';
      } else {
        errorText.textContent = 'เกิดข้อผิดพลาดระหว่างเปิดกล้อง ลองใหม่อีกครั้ง';
      }
      errorOverlay.classList.add('show');
    }
  }

  function stopCamera(){
    if (rafId) cancelAnimationFrame(rafId);
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
  }

  retryBtn.addEventListener('click', startCamera);

  document.getElementById('backBtn').addEventListener('click', () => {
    stopCamera();
    window.location.href = '../../../app/web/03-home/index.html';
  });

  // สร้างรายการปุ่มเลือกโซนเกมในเมนูทดสอบอัตโนมัติ
  Object.keys(ZONE_GAME_URL).forEach(key => {
    const zoneData = ZONE_INFO[key] || { name: key, emoji: '🎮' };
    const btn = document.createElement('button');
    btn.className = 'dev-item';
    btn.innerHTML = `<span>${zoneData.emoji}</span> <span>${zoneData.name}</span>`;
    btn.addEventListener('click', () => {
      devModal.classList.remove('show');
      onScanSuccess('manual-test', ZONE_GAME_URL[key]);
    });
    devList.appendChild(btn);
  });

  // เปิด-ปิด Modal โหมดทดสอบ
  devSkip.addEventListener('click', () => {
    devModal.classList.add('show');
  });
  devClose.addEventListener('click', () => {
    devModal.classList.remove('show');
  });

  window.addEventListener('beforeunload', stopCamera);

  if (!window.jsQR) {
    errorTitle.textContent = 'โหลดตัวอ่าน QR ไม่สำเร็จ';
    errorText.textContent = 'ไฟล์ jsqr.min.js อาจไม่อยู่ที่ assets/js/ ลองเช็ค path แล้วรีเฟรชอีกครั้ง';
    errorOverlay.classList.add('show');
  } else {
    startCamera();
  }
</script>

</body>
</html>
