<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ได้รับตราประทับ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Segoe UI', 'Tahoma', sans-serif;
    background: linear-gradient(180deg, #fdf1cf 0%, #fdf6e9 45%);
    min-height: 100dvh;
  }

  .phone {
    width: 100%;
    max-width: 480px;
    min-height: 100dvh;
    margin: 0 auto;
    background: transparent;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px 16px;
    position: relative;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 700;
    color: #333;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 30px 0;
    text-align: center;
  }

  .badge-ring {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 26px;
    position: relative;
  }
  .badge-ring::before,
  .badge-ring::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px dashed rgba(0,0,0,0.15);
  }
  .badge-ring .paw {
    font-size: 68px;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.15));
  }

  .content h2 {
    font-size: 24px;
    color: #2c4a20;
    margin-bottom: 6px;
  }
  .content p {
    font-size: 15px;
    color: #555;
    margin-bottom: 20px;
  }

  .zone-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #6b4423;
    color: #fdf6e9;
    font-weight: 700;
    font-size: 14px;
    padding: 8px 20px;
    border-radius: 999px;
    margin-bottom: 34px;
  }

  .footer {
    padding: 0 24px 32px;
  }
  .cta-btn {
    width: 100%;
    padding: 15px;
    color: #fff;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .cta-btn:active { transform: scale(0.97); }

  .confetti {
    position: absolute;
    border-radius: 2px;
    opacity: 0.8;
  }
</style>
</head>
<body>

<div class="phone" id="phone">

  <div class="header">
    <h1 id="zoneTitle">Zone</h1>
  </div>

  <div class="content">
    <div class="badge-ring" id="badgeRing"><span class="paw" id="badgeEmoji">🐾</span></div>
    <h2>ยินดีด้วย!</h2>
    <p>คุณได้รับตราประทับ</p>
    <div class="zone-chip" id="zoneChip">🐾 Zone</div>
  </div>

  <div class="footer">
    <button class="cta-btn" id="viewPassportBtn">ดูพาสปอร์ต</button>
  </div>

</div>

<script src="../../../assets/js/zoo-state.js"></script>
<script>
  const ZONE_CONFIG = {
    lion:     { name: 'Lion Zone',     emoji: '🦁', color: '#4a8c3f' },
    elephant: { name: 'Elephant Zone', emoji: '🐘', color: '#5b7fa6' },
    penguin:  { name: 'Penguin Zone',  emoji: '🐧', color: '#2b6cb0' },
    monkey:   { name: 'Monkey Zone',   emoji: '🐒', color: '#a0662b' },
    panda:    { name: 'Panda Zone',    emoji: '🐼', color: '#333333' },
  };

  const params = new URLSearchParams(window.location.search);
  const zoneId = params.get('zone') || 'lion';
  const pointsEarned = parseInt(params.get('points'), 10) || 0;
  const zone = ZONE_CONFIG[zoneId] || ZONE_CONFIG.lion;

  document.title = `${zone.name} — ได้รับตราประทับ`;
  document.getElementById('zoneTitle').textContent = zone.name;
  document.getElementById('badgeEmoji').textContent = zone.emoji;
  document.getElementById('zoneChip').innerHTML = `${zone.emoji} ${zone.name}`;

  const badgeRing = document.getElementById('badgeRing');
  badgeRing.style.border = `6px solid ${zone.color}`;
  badgeRing.style.boxShadow = `0 8px 20px ${zone.color}40`;

  const ctaBtn = document.getElementById('viewPassportBtn');
  ctaBtn.style.background = zone.color;
  ctaBtn.style.boxShadow = `0 4px 10px ${zone.color}59`;
  ctaBtn.addEventListener('mouseenter', () => ctaBtn.style.filter = 'brightness(0.9)');
  ctaBtn.addEventListener('mouseleave', () => ctaBtn.style.filter = 'brightness(1)');

  ZooState.completeZone(zoneId, pointsEarned);

  // สุ่มโรยคอนเฟตตี้ เริ่มจากใต้หัวข้อลงไป จะได้ไม่ทับตัวหนังสือด้านบน
  const phone = document.getElementById('phone');
  const colors = [zone.color, '#f0a336', '#d9862a'];
  for(let i = 0; i < 18; i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    const size = 6 + Math.random() * 6;
    c.style.width = size + 'px';
    c.style.height = size + 'px';
    c.style.left = Math.random() * 100 + '%';
    c.style.top = (18 + Math.random() * 35) + '%';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.transform = `rotate(${Math.random() * 360}deg)`;
    phone.appendChild(c);
  }

  ctaBtn.addEventListener('click', () => {
    window.location.href = '../../../app/web/03-home/index.html';
  });
</script>

</body>
</html>
