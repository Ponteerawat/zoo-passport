<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoo Explorer — แผนที่สวนสัตว์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #f6f1e6;
    --forest-dark: #1f3d1a;
    --leaf: #5a9c3f;
    --leaf-light: #7fc957;
    --wood: #6b4423;
    --gold: #f0a336;
    --muted: #9a9384;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }

  /* เต็มจอจริง ไม่มีกรอบมือถือปลอมๆ ปรับตามขนาดจอทุกแพลตฟอร์ม */
  html, body{
    height: 100%;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
  }

  .app{
    position: fixed;
    inset: 0;             /* ยึดขอบกรอบไว้กับขอบจอที่มองเห็นจริงเป๊ะๆ เสมอ
                              ไม่พึ่งหน่วย vh/dvh/svh ที่บางเบราว์เซอร์คำนวณพลาด
                              ตอนมีแถบแจ้งเตือนของเบราว์เซอร์โผล่มาบังพื้นที่ */
    display: flex;
    flex-direction: column;
    background: var(--cream);
  }

  /* ---------- HEADER ---------- */
  .header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: clamp(14px, 2.4vh, 20px) clamp(16px, 4vw, 28px);
    background: var(--forest-dark);
  }
  .back-btn {
    background: rgba(255,255,255,0.12);
    border: none;
    color: var(--cream);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease;
    flex-shrink: 0;
  }
  .back-btn:hover { background: rgba(255,255,255,0.25); }
  .header h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(18px, 2.2vw, 22px);
    color: var(--gold);
  }

  /* ---------- MAP AREA ---------- */
  .map-area {
    flex: 1;
    min-height: 0;
    position: relative;
    margin: clamp(12px, 2.4vh, 22px) auto;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 22px rgba(0,0,0,0.14);
    width: calc(100% - clamp(32px, 8vw, 64px));
    max-width: 760px;         /* กันแผนที่ยืดกว้างเกินไปบนจอเดสก์ท็อป */
  }
  .map-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .pin {
    position: absolute;
    transform: translate(-50%, -100%) rotate(-45deg);
    width: clamp(34px, 5vw, 44px);
    height: clamp(34px, 5vw, 44px);
    border-radius: 50% 50% 50% 0;
    background: #fff;
    border: 3px solid var(--leaf);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.25);
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .pin span { display: block; transform: rotate(45deg); font-size: clamp(15px, 2.2vw, 20px); }
  .pin:hover { filter: brightness(1.05); }

  .you-are-here {
    position: absolute;
    left: 14px;
    bottom: 14px;
    background: rgba(31,61,26,0.85);
    color: var(--cream);
    font-size: clamp(11px, 1.6vw, 13px);
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .footer-note {
    flex-shrink: 0;
    text-align: center;
    font-size: clamp(11px, 1.4vw, 13px);
    color: var(--muted);
    padding: 0 20px clamp(14px, 2.4vh, 22px);
  }
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <button class="back-btn" id="backBtn" aria-label="ย้อนกลับ">←</button>
    <h1>Zoo Map</h1>
  </div>

  <div class="map-area">
    <img src="../../../assets/img/zoomapnew.png" alt="">
    <!-- หมุดแต่ละโซน (ตำแหน่งเป็น % จากซ้าย/บนของกรอบแผนที่ ปรับได้ตามรูปจริง) -->
    <div class="pin" style="left: 12%; top:36%;" data-zone="lion" title="Lion Zone"><span>🦁</span></div>
    <div class="pin" style="left:46%; top:23%;" data-zone="giraffe" title="Giraffe Zone"><span>🦒</span></div>
    <div class="pin" style="left:77%; top:27%;" data-zone="elephant" title="Elephant Zone"><span>🐧</span></div>
    <div class="pin" style="left:7%; top:64%;" data-zone="penguin" title="Penguin Zone"><span>🐼</span></div>
    <div class="pin" style="left:44%; top:57%;" data-zone="panda" title="Panda Zone"><span>🐵</span></div>
    <div class="pin" style="left:75%; top:56%;" data-zone="monkey" title="Monkey Zone"><span>🐘</span></div>

    <div class="you-are-here">📍 You are here</div>
  </div>

  <div class="footer-note">แตะหมุดเพื่อดูรายละเอียดของแต่ละโซน</div>

</div>

<script>
  document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = '../../web/03-home/index.html';
  });

  // แตะหมุด -> ไปหน้าสแกน QR ของโซนนั้นก่อนเสมอ (สแกนติดโซนจริงถึงจะเข้าเกม/ปลดล็อกได้)
  document.querySelectorAll('.pin').forEach(pin => {
    pin.addEventListener('click', () => {
      const zone = pin.dataset.zone;
      window.location.href = `../11-qr-scan/index.html?zone=${zone}`;
    });
  });
</script>

</body>
</html>
