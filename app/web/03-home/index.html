<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoo Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="../../../assets/js/zoo-state.js"></script>
</head>
<body>


<div class="app-frame" id="appFrame">

  <!-- ============ HOME PAGE ============ -->
  <div id="homePage">
    <div class="header">
      <div class="leaf tl">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 11 0 C 20 70, 40 40, 90 15 C 70 45, 55 70, 50 110 Z" fill="#5a9c3f" opacity="0.85"/>
          <path d="M5 100 C 15 65, 35 35, 80 10 C 60 40, 45 65, 40 100 Z" fill="#7fc957" opacity="0.7"/>
        </svg>
      </div>
      <div class="leaf tr">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 110 C 20 70, 40 40, 90 15 C 70 45, 55 70, 50 110 Z" fill="#5a9c3f" opacity="0.85"/>
          <path d="M5 100 C 15 65, 35 35, 80 10 C 60 40, 45 65, 40 100 Z" fill="#7fc957" opacity="0.7"/>
        </svg>
      </div>
      <div class="logo-wrap">
        <div class="logo-icons"><img src="../../../assets/img/logozoo.png" alt="Zoo Explorer" width="200px" height="200px"></div>
        <div class="logo-title">ZOO EXPLOROR</div>
        <div class="logo-sub">ZOO EXPLORER</div>
      </div>
    </div>

    <div class="body-scroll">
      <div class="progress-heading">Your Progress</div>
      <div class="progress-count" id="progressCount">0 / 6 Stamps</div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>

      <div class="zone-list" id="zoneList"></div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item active" id="navPassport">
         <span class="nav-icon" style="font-size:22px;">📖</span>
          <span class="nav-label">Passport</span>
      </div>
      <div class="nav-item" id="navMap">
        <span class="nav-icon" style="font-size:22px;">📷</span>
        <span class="nav-label">Scan QR</span>
      </div>
      <div class="nav-item" id="navProfile">
        <span class="nav-icon" style="font-size:22px;">👤</span>
        <span class="nav-label">Profile</span>
      </div>
    </div>
  </div>

  <!-- ============ ZONE DETAIL PAGE ============ -->
  <div class="detail-page" id="detailPage">
    <div class="detail-header">
      <button class="back-btn" id="backBtn">←</button>
      <div class="detail-title" id="detailHeaderTitle">Zone</div>
    </div>
    <div class="detail-body">
      <div class="detail-avatar" id="detailAvatar">🦁</div>
      <div class="detail-name" id="detailName">Lion Zone</div>

      <div class="info-card story-card">
        <div class="info-card-title" id="detailStoryTitle">Story</div>
        <div class="info-card-text" id="detailStoryText">...</div>
      </div>

      <div class="info-card mission-card">
        <div class="info-card-label">🎯 ภารกิจของคุณ</div>
        <div class="info-card-text" id="detailMissionText">...</div>
      </div>

      <div class="info-card reward-card">
        <div class="info-card-label">Reward</div>
        <div class="info-card-text" id="detailRewardText">...</div>
      </div>
    </div>
  </div>

</div>

<script>
const zones = [
  { id:'lion', name:'Lion Zone', image:'../../../assets/img/lionlogo.png',
    story: {
      title: 'นักล่าแห่งทุ่งหญ้า',
      text: 'สิงโตจอมพลังกำลังฝึกวิ่งล่าสัตว์ในทุ่งหญ้ากว้าง แต่เหยื่อวิ่งหลบซ้าย ขวา และตรงหน้าอย่างรวดเร็ว สิงโตต้องอาศัยทั้งความเร็วและความแม่นยำ'
    },
    mission: 'ช่วยสิงโตวิ่งผ่านเส้นทาง 3 เลน หลบสิ่งกีดขวาง และเก็บเนื้อให้ครบตามจำนวนที่กำหนด เมื่อสิงโตได้อาหารครบ มันก็พร้อมกลับไปดูแลครอบครัว',
    reward: '🏅 Lion Stamp'
  },
  { id:'elephant', name:'Elephant Zone', image:'../../../assets/img/Elepantlogo.png',
    story: {
      title: 'มื้ออร่อยของเจ้าช้าง',
      text: 'ถึงเวลาอาหารกลางวันแล้ว! แต่เจ้าช้างตัวใหญ่รออาหารอยู่ไกลเกินไป คนดูแลสวนสัตว์จึงขอให้คุณช่วยป้อนอาหารแทน'
    },
    mission: 'เล็งและโยนอาหาร ให้เข้าปากช้างให้ได้มากที่สุด ยิ่งโยนแม่น ช้างก็ยิ่งอิ่มและมีความสุข',
    reward: '🏅 Elephant Stamp'
  },
  { id:'giraffe', name:'Giraffe Zone', image:'../../../assets/img/Girafflogo.png',
    story: {
      title: 'ยีราฟผู้เฝ้ามองท้องฟ้า',
      text: 'ยีราฟประจำสวนสัตว์ได้รับหน้าที่คอยสังเกตเส้นทางและมองหาต้นไม้ที่มีใบอ่อนที่สุดให้เพื่อนสัตว์ แต่วันนี้... ต้นไม้เติบโตสูงกว่าปกติ! ยีราฟต้องยืดคอให้สูงที่สุดเพื่อมองเห็นเส้นทางด้านหน้า แต่ลำพังมันทำไม่สำเร็จ'
    },
    mission: 'ช่วยยีราฟยืดคอให้สูงถึงระดับที่กำหนด เพื่อให้มันสามารถมองเห็นต้นทางและค้นหาใบไม้แสนอร่อยได้สำเร็จ',
    reward: '🏅 Giraffe Stamp'
  },
  { id:'penguin', name:'Penguin Zone', image:'../../../assets/img/panguinlogo.png',
    story: {
      title: 'นักตกปลาตัวน้อย',
      text: 'อากาศเย็นสบายในโซนเพนกวิน แต่ปลาวันนี้ว่ายน้ำเร็วผิดปกติ เหล่าเพนกวินจึงจับปลาได้ยากกว่าทุกวัน พวกมันต้องการผู้ช่วย!'
    },
    mission: 'ช่วยเพนกวินจับปลาให้ได้ตามจำนวนที่กำหนด เมื่อเพนกวินได้อาหารครบ ทุกตัวก็จะพร้อมกลับไปพักผ่อนบนก้อนน้ำแข็ง',
    reward: '🏅 Penguin Stamp'
  },
  { id:'panda', name:'Panda Zone', image:'../../../assets/img/pandalogo.png',
    story: {
      title: 'การผจญภัยในป่าไผ่',
      text: 'เช้าวันนี้ แพนด้าน้อยออกตามหาไผ่ต้นโปรด แต่ระหว่างทาง เต็มไปด้วยหลุม ทางต่างระดับ และอุปสรรคมากมาย มันไม่สามารถเดินทางเพียงลำพังได้'
    },
    mission: 'ช่วยแพนด้ากระโดดผ่านอุปสรรค หลบหลุม และเก็บไม้ไผ่ให้ได้มากที่สุดจนถึงเส้นชัย',
    reward: '🏅 Panda Stamp'
  },
  { id:'monkey', name:'Monkey Zone', image:'../../../assets/img/Monkeylogo.png',
    story: {
      title: 'ภารกิจเก็บกล้วย',
      text: 'ลมแรงพัดผ่านป่าลิง ทำให้กล้วยสุกจำนวนมากหล่นลงมาจากต้น หากปล่อยไว้ ผลไม้จะเสียหายหมด เจ้าลิงตัวน้อยจึงรีบออกมาเก็บกล้วย แต่ต้องการผู้ช่วยอีกแรง'
    },
    mission: 'ลากลิงไปยังตำแหน่งต่าง ๆ เพื่อรับกล้วยที่กำลังตกลงมาให้ได้มากที่สุด ยิ่งเก็บได้มาก เจ้าลิงก็ยิ่งดีใจ',
    reward: '🏅 Monkey Stamp'
  },
];

  // สถานะปลดล็อกจริง (มาจาก localStorage) — ตราจะติ๊กถูก/นับเพิ่มก็ต่อเมื่อเล่นเกมของโซนนั้นจบแล้วเท่านั้น
  let completed = ZooState.getState().stamps;

  const zoneListEl = document.getElementById('zoneList');
  const progressCountEl = document.getElementById('progressCount');
  const progressFillEl = document.getElementById('progressFill');

  const homePage = document.getElementById('homePage');
  const detailPage = document.getElementById('detailPage');
  const detailAvatar = document.getElementById('detailAvatar');
  const detailName = document.getElementById('detailName');
  const detailStoryTitle = document.getElementById('detailStoryTitle');
  const detailStoryText = document.getElementById('detailStoryText');
  const detailMissionText = document.getElementById('detailMissionText');
  const detailRewardText = document.getElementById('detailRewardText');
  const detailHeaderTitle = document.getElementById('detailHeaderTitle');
  const backBtn = document.getElementById('backBtn');

  let currentZoneId = null;

 function renderHome(){
  zoneListEl.innerHTML = '';
  zones.forEach(z => {
    const row = document.createElement('div');
    row.className = 'zone-row' + (completed[z.id] ? ' done' : '');
    const avatarContent = z.image
      ? `<img src="${z.image}" alt="${z.name}">`
      : z.emoji;
    row.innerHTML = `
      <div class="zone-avatar">${avatarContent}</div>
      <div class="zone-name">${z.name}</div>
      <div class="zone-check">✓</div>
      <div class="zone-arrow">›</div>
    `;
    row.addEventListener('click', () => openZone(z.id));
    zoneListEl.appendChild(row);
  });

  const doneCount = Object.values(completed).filter(Boolean).length;
  progressCountEl.textContent = `${doneCount} / ${zones.length} Stamps`;
  progressFillEl.style.width = `${(doneCount / zones.length) * 100}%`;
}

  function openZone(id){
  const zone = zones.find(z => z.id === id);
  if(!zone) return;
  currentZoneId = id;

  detailAvatar.innerHTML = zone.image
    ? `<img src="${zone.image}" alt="${zone.name}">`
    : zone.emoji;
  detailName.textContent = zone.name;
  detailHeaderTitle.textContent = zone.name;
  detailStoryTitle.textContent = zone.story.title;
  detailStoryText.textContent = zone.story.text;
  detailMissionText.textContent = zone.mission;
  detailRewardText.textContent = zone.reward;

  homePage.style.display = 'none';
  detailPage.style.display = 'flex';
}

  backBtn.addEventListener('click', () => {
    detailPage.style.display = 'none';
    homePage.style.display = 'flex';
  });

  // เมนูล่าง: พาสปอร์ต(หน้านี้) / แผนที่ / โปรไฟล์
  document.getElementById('navMap').addEventListener('click', () => {
    window.location.href = '../11-qr-scan/index.html';
  });
  document.getElementById('navProfile').addEventListener('click', () => {
    window.location.href = '../10-profile/index.html';
  });

  renderHome();
</script>

</body>
</html>
