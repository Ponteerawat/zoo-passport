<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoo Explorer — My Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="../../../assets/js/zoo-state.js"></script>
<style>
  :root{
    --cream: #f6f1e6;
    --forest-dark: #1f3d1a;
    --leaf: #5a9c3f;
    --leaf-light: #7fc957;
    --gold: #f0a336;
    --ink: #2c2418;
    --muted: #9a9384;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }

  /* เต็มจอจริง ไม่มีกรอบมือถือปลอมๆ ปรับตามขนาดจอทุกแพลตฟอร์ม */
  html, body{
    height: 100%;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
  }

  .app{
    position: fixed;
    inset: 0;             /* ยึดขอบกรอบไว้กับขอบจอที่มองเห็นจริงเป๊ะๆ เสมอ
                              ไม่พึ่งหน่วย vh/dvh/svh ที่บางเบราว์เซอร์คำนวณพลาด
                              ตอนมีแถบแจ้งเตือนของเบราว์เซอร์โผล่มาบังพื้นที่ */
    display: flex;
    flex-direction: column;
    background: var(--cream);
  }

  /* ---------- HEADER ---------- */
  .header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: clamp(14px, 2.4vh, 20px) clamp(16px, 4vw, 28px);
    background: var(--forest-dark);
  }
  .back-btn {
    background: rgba(255,255,255,0.12);
    border: none;
    color: var(--cream);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease;
    flex-shrink: 0;
  }
  .back-btn:hover { background: rgba(255,255,255,0.25); }
  .header h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(18px, 2.2vw, 22px);
    color: var(--gold);
  }

  /* ---------- SCROLLABLE BODY ---------- */
  .body-scroll {
    flex: 1;
    min-height: 0;      /* กันบั๊ก flexbox ที่ทำให้กล่องนี้เลื่อนไม่ได้ */
    overflow-y: auto;
    padding: clamp(18px, 3vh, 26px) clamp(16px, 4vw, 26px);
  }
  .content-inner{
    width: 100%;
    max-width: 480px;    /* กันเนื้อหายืดกว้างเกินไปบนจอเดสก์ท็อป/แท็บเล็ต */
    margin: 0 auto;
  }

  .summary {
    text-align: center;
    padding: 4px 0 20px;
    font-size: clamp(13px, 1.6vw, 15px);
    color: #555;
  }
  .summary strong { color: var(--leaf); }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: clamp(18px, 3vw, 26px) clamp(14px, 3vw, 20px);
  }

  .item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .avatar {
    width: clamp(70px, 12vw, 88px);
    height: clamp(70px, 12vw, 88px);
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--leaf);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    margin-bottom: 8px;
    position: relative;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .item.locked .avatar {
    filter: grayscale(1);
    opacity: 0.5;
    border-color: #c9c3b3;
  }
  .item.locked .avatar::after {
    content: '🔒';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    background: rgba(255,255,255,0.35);
  }

  .name {
    font-family: 'Baloo 2', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--forest-dark);
  }
  .item.locked .name { color: var(--muted); }

  .item.unlocked .avatar { cursor: pointer; transition: transform 0.15s ease; }
  .item.unlocked .avatar:hover { transform: translateY(-2px); }
  .item.unlocked .avatar:active { transform: scale(0.95); }

  .item.locked .avatar { cursor: not-allowed; }

  /* ---- Toast แจ้งเตือนตอนแตะการ์ดที่ยังล็อกอยู่ ---- */
  .toast {
    position: absolute;
    left: 50%;
    bottom: clamp(18px, 3vh, 28px);
    transform: translateX(-50%) translateY(10px);
    background: rgba(31,61,26,0.92);
    color: var(--cream);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 999px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 10;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <button class="back-btn" id="backBtn" aria-label="ย้อนกลับ">←</button>
    <h1>My Collection</h1>
  </div>

  <div class="body-scroll">
    <div class="content-inner">
      <p class="summary">สะสมได้แล้ว <strong id="collectedCount">3</strong> / 6 ตราประทับ</p>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div class="toast" id="toast">ปลดล็อกโซนนี้ก่อนถึงจะเข้าดูได้</div>

</div>

<script>
  // done: มาจากสถานะจริง — true ก็ต่อเมื่อเล่นเกมของโซนนั้นจบแล้ว (ปลดล็อกตราประทับจริง) เท่านั้น
  // href: หน้ารายละเอียดของโซนนั้นๆ (ตอนนี้มีจริงแค่ Lion Zone ส่วนโซนอื่นยังไม่ได้สร้างหน้า)
  const stampState = ZooState.getState().stamps;
  const zones = [
    { id:'lion',     name:'Lion',     image:'../../../assets/img/lionlogo.png',    href:'https://mywebar.com/p/Project_2_c9toz5pubb' },
    { id:'elephant', name:'Elephant', image:'../../../assets/img/Elepantlogo.png', href:'https://mywebar.com/p/Project_1_m4zof44vk6' },
    { id:'giraffe',  name:'Giraffe',  image:'../../../assets/img/Girafflogo.png',  href:'https://mywebar.com/p/Project_2_bd8ea5f0ec' },
    { id:'penguin',  name:'Penguin',  image:'../../../assets/img/panguinlogo.png', href:'https://mywebar.com/p/Project_0_d1rkybo8q3' },
    { id:'panda',    name:'Panda',    image:'../../../assets/img/pandalogo.png',   href:'https://mywebar.com/p/Project_4_fsuh5vgdi' },
    { id:'monkey',   name:'Monkey',   image:'../../../assets/img/Monkeylogo.png',  href:'https://mywebar.com/p/Project_3_gmetd5s95j' },
  ].map(z => Object.assign(z, { done: !!stampState[z.id] }));

  const grid = document.getElementById('grid');
  const toast = document.getElementById('toast');
  document.getElementById('collectedCount').textContent = ZooState.getStampCount();

  let toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  zones.forEach(z => {
    const el = document.createElement('div');
    el.className = 'item ' + (z.done ? 'unlocked' : 'locked');
    el.innerHTML = `
      <div class="avatar"><img src="${z.image}" alt="${z.name}"></div>
      <div class="name">${z.name}</div>
    `;

    if(z.done){
      // ปลดล็อกแล้ว -> กดเพื่อดูรายละเอียดโซนได้
      el.addEventListener('click', () => {
        window.location.href = z.href;
      });
    } else {
      // ยังล็อกอยู่ -> กดแล้วแค่แจ้งเตือน ไม่พาไปไหน
      el.addEventListener('click', () => {
        showToast(`ยังไม่ได้ปลดล็อก ${z.name} Zone`);
      });
    }

    grid.appendChild(el);
  });

  document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = '../10-profile/index.html';
  });
</script>

</body>
</html>
